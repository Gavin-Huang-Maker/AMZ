<!DOCTYPE html>
<html lang="zh-CN" data-page="cvr-tree">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>亚马逊运营工具箱</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#171a1f; --muted:#6b7280; --hint:#9aa1ab;
    --border:#e5e8ec; --accent:#e8590c; --accent-2:#d9480f; --soft:#fff2e8;
    --danger:#d92d20; --ring:rgba(232,89,12,.18);
    --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f13; --card:#171a20; --text:#e8eaed; --muted:#a2a8b3; --hint:#6f757f;
      --border:#272c35; --accent:#ff7a33; --accent-2:#e8590c; --soft:#241a14;
      --danger:#ff6b5e; --ring:rgba(255,122,51,.22);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);
  }
  .logo{
    width:42px;height:42px;border-radius:12px;margin-bottom:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#fff;
  }
  h1{font-size:18px;font-weight:650;letter-spacing:-.2px;margin-bottom:6px;}
  .sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px;}
  label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;}
  input[type=password]{
    width:100%;padding:11px 13px;font-size:14px;color:var(--text);
    background:var(--bg);border:1px solid var(--border);border-radius:10px;
    outline:none;transition:border-color .15s,box-shadow .15s;
    font-family:inherit;
  }
  input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
  .row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:12.5px;color:var(--muted);}
  .row input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
  button{
    width:100%;padding:11px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:0;border-radius:10px;font-family:inherit;
    transition:opacity .15s,transform .1s;
  }
  button:hover{opacity:.92;}
  button:active{transform:scale(.99);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  .msg{font-size:12.5px;margin-top:14px;min-height:18px;line-height:1.5;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--accent);}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--hint);line-height:1.65;}
  /* 解密遮罩：缓存命中时避免闪一下登录框 */
  #boot{
    position:fixed;inset:0;background:var(--bg);z-index:9;
    display:flex;align-items:center;justify-content:center;
  }
  .spin{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid var(--border);border-top-color:var(--accent);
    animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  .hide{display:none !important;}
</style>
</head>
<body>

<div id="boot"><div class="spin"></div></div>

<div class="card" id="gate" style="display:none">
  <div class="logo">A</div>
  <h1>亚马逊运营工具箱</h1>
  <p class="sub">内部授权访问，请输入访问密码。</p>

  <label class="fl" for="pw">访问密码</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••••" spellcheck="false">
  <div class="row"><input id="rm" type="checkbox" checked><label for="rm">在这台设备上记住 7 天</label></div>
  <button id="go">进入工具箱</button>
  <div class="msg" id="msg"></div>

  <div class="foot">页面内容在本地浏览器内解密，不上传任何数据。<br>密码遗失需联系管理员重新生成站点。</div>
</div>

<script src="../g/gate.js"></script>
</body>
</html>
